# Save as .github/workflows/metrics.yml in your profile repo
# Needs a repository secret named METRICS_TOKEN (a GitHub personal access token)
name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          output_action: commit
          committer_message: "Update metrics"
          config_timezone: Asia/Jakarta
          config_display: columns
          base: header, activity, community, repositories, metadata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 6
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_charts: yes
          plugin_lines: yes

  recolor:
    needs: github-metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recolor to dark blue
        run: |
          python3 - << 'PY'
          import re
          colors = {
            # greens -> blue ramp (low to high)
            "#0e4429": "#12315c", "#033a16": "#12315c", "#196c2e": "#12315c", "#216e39": "#12315c",
            "#006d32": "#1d4e89", "#238636": "#1d4e89", "#30a14e": "#1d4e89",
            "#26a641": "#3b7dd8", "#2ea043": "#3b7dd8", "#2da44e": "#3b7dd8", "#40c463": "#3b7dd8",
            "#39d353": "#6fb1ff", "#3fb950": "#6fb1ff", "#56d364": "#6fb1ff", "#9be9a8": "#6fb1ff",
            # empty cells / floor tiles -> dark navy
            "#ebedf0": "#14233f", "#161b22": "#14233f",
            # link and title blue -> tiger blue
            "#58a6ff": "#6fb1ff", "#0969da": "#3b7dd8", "#4493f8": "#6fb1ff",
          }
          s = open("metrics.svg", encoding="utf-8").read()
          for old, new in colors.items():
              s = re.sub(old, new, s, flags=re.I)
          open("metrics.svg", "w", encoding="utf-8").write(s)
          PY

      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add metrics.svg
          git commit -m "Recolor metrics" || exit 0
          git push
